[project]
name = "WDM_GW_wavelets"
version = "0.0.2"
authors = [
  { name="Christopher J. Moore", email="cjm96@cam.ac.uk"},
  { name="Tomasz Kinowski", email="tk593@cam.ac.uk"}
]
description = "A fast, JAX-based Python implementation of the Wilson-Daubechies-Meyer (WDM) wavelet transform for the time-frequency analysis of gravitational wave data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "jax",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

keywords = [
    "gravitational waves",
    "wavelets",
    "WDM",
    "time-frequency analysis",
    "signal processing",
    "astronomy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "astropy",
    "ipykernel",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-autobuild",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/cjm96/WDM_GW_wavelets"
Repository = "https://github.com/cjm96/WDM_GW_wavelets"
Issues = "https://github.com/cjm96/WDM_GW_wavelets/issues"
Documentation = "https://cjm96.github.io/WDM_GW_wavelets/"

[tool.setuptools.packages.find]
where = ["src"]
